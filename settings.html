<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | KALAI LINK</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/pages.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="page-transition">
    <!-- Header -->
    <header class="header">
        <div class="container header-container">
            <a href="index.html" class="logo">
                <i data-lucide="flower-2" class="logo-icon"></i>
                KALAI LINK
            </a>
            <div style="display: flex; align-items: center; gap: var(--spacing-md);">
                <button class="btn-icon"><i data-lucide="bell"></i></button>
                <div style="position: relative;" class="profile-dropdown-container">
                    <button style="width: 40px; height: 40px; border-radius: 50%; background-color: var(--color-primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; border: none; cursor: pointer; padding: 0;" onclick="document.getElementById('profileDropdown').classList.toggle('show')">
                        <span id="headerInitial">L</span>
                    </button>
                    <div id="profileDropdown" class="profile-dropdown">
                        <div style="padding: 12px 16px; border-bottom: 1px solid var(--color-border);">
                            <strong id="dropdownName" style="display: block; color: var(--color-text);">Lakshmi Devi</strong>
                            <span style="font-size: 0.75rem; color: var(--color-text-muted);">Artisan</span>
                        </div>
                        <a href="settings.html" style="display: flex; align-items: center; padding: 10px 16px; color: var(--color-text); text-decoration: none;"><i data-lucide="settings" style="width: 16px; height: 16px; margin-right: 8px;"></i> Settings</a>
                        <a href="index.html" style="display: flex; align-items: center; padding: 10px 16px; color: var(--color-error); text-decoration: none; border-top: 1px solid var(--color-border);"><i data-lucide="log-out" style="width: 16px; height: 16px; margin-right: 8px;"></i> Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav class="sidebar-nav">
                <a href="artisan-dashboard.html" class="sidebar-item">
                    <i data-lucide="layout-dashboard"></i> Dashboard
                </a>
                <a href="add-product.html" class="sidebar-item">
                    <i data-lucide="plus-circle"></i> Add Product
                </a>
                <a href="your-products.html" class="sidebar-item">
                    <i data-lucide="package"></i> Your Products
                </a>
                <a href="orders.html" class="sidebar-item">
                    <i data-lucide="shopping-bag"></i> Orders & Enquiries
                </a>
                <a href="market-insights.html" class="sidebar-item">
                    <i data-lucide="bar-chart-2"></i> Market Insights
                </a>
                <a href="settings.html" class="sidebar-item active">
                    <i data-lucide="settings"></i> Settings
                </a>
            </nav>
        </aside>

        <main class="main-content container animate-slide-up">
            <h1 style="font-size: 2rem; margin-bottom: var(--spacing-xl);">Account Settings</h1>

            <div class="card" style="max-width: 600px;">
                <div class="card-body">
                    <form id="settingsForm">
                        <div class="form-group">
                            <label class="form-label" for="settingName">Full Name</label>
                            <input type="text" id="settingName" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="settingLocation">Location (State/District)</label>
                            <input type="text" id="settingLocation" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="settingCraft">Primary Craft Specialization</label>
                            <select id="settingCraft" class="form-control">
                                <option value="Textiles & Weaving">Textiles & Weaving</option>
                                <option value="Pottery & Ceramics">Pottery & Ceramics</option>
                                <option value="Basketry & Palm Leaf">Basketry & Palm Leaf</option>
                                <option value="Woodcraft">Woodcraft</option>
                                <option value="Jewellery">Jewellery</option>
                                <option value="Handicrafts">Handicrafts</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="settingLanguage">Preferred Language</label>
                            <select id="settingLanguage" class="form-control">
                                <option value="English">English</option>
                                <option value="Hindi">हिन्दी (Hindi)</option>
                                <option value="Tamil">தமிழ் (Tamil)</option>
                                <option value="Telugu">తెలుగు (Telugu)</option>
                            </select>
                        </div>

                        <div style="margin-top: var(--spacing-xl); display: flex; gap: var(--spacing-md); justify-content: flex-end;">
                            <button type="button" class="btn btn-secondary" onclick="window.location.reload()">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                        </div>
                    </form>
                </div>
            </div>
            
        </main>
    </div>

    <!-- Bottom Navigation for Mobile -->
    <nav class="bottom-nav">
        <a href="artisan-dashboard.html" class="bottom-nav-item"><i data-lucide="layout-dashboard" class="bottom-nav-icon"></i><span>Home</span></a>
        <a href="your-products.html" class="bottom-nav-item"><i data-lucide="package" class="bottom-nav-icon"></i><span>Products</span></a>
        <a href="add-product.html" class="bottom-nav-item">
            <div style="background-color: var(--color-primary); color: white; padding: 12px; border-radius: 50%; transform: translateY(-20px); box-shadow: 0 4px 10px rgba(140, 58, 39, 0.4);"><i data-lucide="plus" class="bottom-nav-icon"></i></div>
            <span style="transform: translateY(-10px);">Add</span>
        </a>
        <a href="orders.html" class="bottom-nav-item"><i data-lucide="shopping-bag" class="bottom-nav-icon"></i><span>Orders</span></a>
        <a href="settings.html" class="bottom-nav-item active"><i data-lucide="user" class="bottom-nav-icon"></i><span>Profile</span></a>
    </nav>

    <script src="js/app.js"></script>
    <script src="js/navigation.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(localStorage.getItem('kalai_user') || '{"name":"Lakshmi Devi", "location":"Tamil Nadu", "craft":"Basketry"}');
            
            if(userData.name) {
                document.getElementById('headerInitial').textContent = userData.name.charAt(0);
                document.getElementById('settingName').value = userData.name;
            }
            if(userData.location) document.getElementById('settingLocation').value = userData.location;
            
            // Set select values
            const craftSelect = document.getElementById('settingCraft');
            for(let i=0; i<craftSelect.options.length; i++) {
                if(craftSelect.options[i].value.includes(userData.craft)) {
                    craftSelect.selectedIndex = i;
                    break;
                }
            }

            document.getElementById('settingsForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const newName = document.getElementById('settingName').value;
                const newLocation = document.getElementById('settingLocation').value;
                const newCraft = document.getElementById('settingCraft').value;
                
                localStorage.setItem('kalai_user', JSON.stringify({
                    name: newName,
                    location: newLocation,
                    craft: newCraft
                }));
                
                document.getElementById('headerInitial').textContent = newName.charAt(0);
                App.showToast('Profile updated successfully!', 'success');
            });

            lucide.createIcons();
        });
    </script>
</body>
</html>
